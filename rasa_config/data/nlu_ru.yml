version: "3.1"

nlu:
  - intent: greet
    examples: |
      - привет
      - здравствуй
      - хай
      - добрый день
      - доброе утро
      - добрый вечер
      - приветствую
      - здаров
      - давай начнем
      - привет друг
      - доброеутро
      - добрыйвечер
      - добрый день

  - intent: goodbye
    examples: |
      - пока
      - до свидания
      - увидимся позже
      - спокойной ночи
      - прощай
      - всего хорошего
      - хорошего дня
      - до встречи
      - пока-пока
      - до скорого

  - intent: affirm
    examples: |
      - да
      - д
      - конечно
      - точно
      - звучит хорошо
      - верно

  - intent: deny
    examples: |
      - нет
      - н
      - никогда
      - я так не думаю
      - мне это не нравится
      - ни за что
      - не совсем

  - intent: mood_great
    examples: |
      - отлично
      - прекрасно
      - замечательно
      - чувствую себя королем
      - чудесно
      - я чувствую себя очень хорошо
      - я великолепен
      - я потрясающий
      - я спасу мир
      - в полном восторге
      - невероятно хорошо
      - так прекрасно
      - так хорошо
      - идеально

  - intent: mood_unhappy
    examples: |
      - мой день был ужасен
      - мне грустно
      - я плохо себя чувствую
      - я разочарован
      - очень грустно
      - мне так грустно
      - грустно
      - очень печально
      - несчастлив
      - не хорошо
      - не очень хорошо
      - чрезвычайно грустно
      - так грустно
      - очень грусно

  - intent: bot_challenge
    examples: |
      - ты бот?
      - ты человек?
      - я разговариваю с ботом?
      - я разговариваю с человеком?

  - intent: ask_architecture
    examples: |
      - расскажи об архитектуре ПО
      - что такое архитектура программного обеспечения
      - объясни принципы архитектуры
      - как проектировать архитектуру приложения
