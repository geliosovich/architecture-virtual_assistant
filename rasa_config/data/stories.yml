version: "3.1"

stories:
  - story: happy path
    steps:
      - intent: greet
      - action: utter_greet
      - intent: mood_great
      - action: utter_happy

  - story: sad path 1
    steps:
      - intent: greet
      - action: utter_greet
      - intent: mood_unhappy
      - action: utter_cheer_up
      - action: utter_did_that_help
      - intent: affirm
      - action: utter_happy

  - story: sad path 2
    steps:
      - intent: greet
      - action: utter_greet
      - intent: mood_unhappy
      - action: utter_cheer_up
      - action: utter_did_that_help
      - intent: deny
      - action: utter_goodbye

  - story: architecture inquiry path
    steps:
      - intent: greet
      - action: utter_greet
      - intent: ask_architecture # Пользователь спрашивает об архитектуре ПО
      - action: utter_architecture_response # Бот дает развернутый ответ об архитектуре
      - action: utter_ask_more # Бот уточняет, нужна ли дополнительная информация
